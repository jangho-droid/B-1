<script type="text/babel">
function Frame({ h = 880, children }) {
  const ref = React.useRef(null);
  const [k, setK] = React.useState(1);
  const [show, setShow] = React.useState(false);
  React.useLayoutEffect(() => {
    const el = ref.current; if (!el) return;
    const upd = () => { const v = Math.round(Math.min(1, el.clientWidth / 1280) * 1000) / 1000; setK((p) => (Math.abs(p - v) > 0.002 ? v : p)); };
    const vis = () => { const r = el.getBoundingClientRect(), vh = window.innerHeight; setShow(r.bottom > -vh * 0.5 && r.top < vh * 1.5); };
    upd(); vis();
    let raf = 0; const onScroll = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; vis(); }); };
    const onResize = () => { upd(); vis(); };
    window.addEventListener('resize', onResize);
    window.addEventListener('scroll', onScroll, { passive: true });
    const t = setInterval(vis, 400);
    return () => { window.removeEventListener('resize', onResize); window.removeEventListener('scroll', onScroll); clearInterval(t); cancelAnimationFrame(raf); };
  }, []);
  return (
    <div className="frame" ref={ref} style={{ height: h * k }}>
      {show ? <div className="frame-in" style={{ width: 1280, height: h, transform: `scale(${k})`, '--app-h': h + 'px' }}>{children}</div> : <div className="frame-ph">화면 불러오는 중</div>}
    </div>
  );
}
function Step({ n, title, desc, h, children }) {
  return (
    <div className="step">
      <div className="step-h"><span className="step-n">{n}</span><div className="step-t"><b>{title}</b><span>{desc}</span></div></div>
      <Frame h={h}>{children}</Frame>
    </div>
  );
}
function HCard({ id, k, head, body, metrics, q }) {
  return (
    <div className="hcard" id={id}>
      <div><span className="hcard-k">{k}</span><h3>{head}</h3><p>{body}</p></div>
      <div className="hcard-m">{metrics.map(([l, b, a]) => <div key={l} className="hcard-row"><span>{l}</span><div><span>{b}</span><span>→</span><b className="a">{a}</b></div></div>)}</div>
      <div className="hcard-q"><b>팀 논의</b>{q}</div>
    </div>
  );
}
